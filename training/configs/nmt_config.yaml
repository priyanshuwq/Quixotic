# Training Configuration - NMT Model (MarianMT/NLLB-200)

model:
  name: "Helsinki-NLP/opus-mt-hi"
  max_length: 128
  vocab_size: 250003
  d_model: 512
  num_heads: 8
  num_encoder_layers: 6
  num_decoder_layers: 6
  dropout: 0.1
  label_smoothing: 0.1

data:
  source_lang: "hi"
  target_lang: "sat"
  train_file: "data/processed/train.parquet"
  val_file: "data/processed/val.parquet"
  test_file: "data/processed/test.parquet"
  max_seq_length: 128
  batch_size: 32

training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.01
  warmup_steps: 4000
  scheduler: "triangular"
  optimizer: "adamw"
  gradient_accumulation_steps: 2
  fp16: true
  seed: 42

quantization:
  enabled: true
  format: "onnx"
  quantize_dynamic: true
  optimize_for_cpu: true
  output_dir: "models/exported"

languages:
  - code: "ho"
    name: "Ho"
    speakers: 1400000
  - code: "mnj"
    name: "Mundari"
    speakers: 2000000
  - code: "sat"
    name: "Santhali"
    speakers: 7400000
