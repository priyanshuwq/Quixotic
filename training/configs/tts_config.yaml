# Training Configuration - TTS Model (Piper TTS / VITS)

model:
  engine: "piper"
  sample_rate: 22050

languages:
  ho:
    model_path: "models/pretrained/piper_ho.onnx"
    sample_rate: 22050
  mnj:
    model_path: "models/pretrained/piper_mnj.onnx"
    sample_rate: 22050
  sat:
    model_path: "models/pretrained/piper_sat.onnx"
    sample_rate: 22050

output:
  format: "onnx"
  quantize_dynamic: true
  optimize_for_cpu: true
